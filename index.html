<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmox VE — Operación Optiplex</title><style>
:root{--bg:#f1f3f5;--p:#fff;--l:#d7dade;--t:#25282b;--m:#697078;--b:#1676c7;--g:#2d9d55;--o:#d78b19;--s:#252a2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{height:52px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 15px;gap:18px}.brand{font-size:18px;font-weight:700}.brand span{font-weight:400;color:#777}.crumb{color:#555}.sim{margin-left:auto;background:#fff3d2;border:1px solid #ebd18c;color:#805f00;padding:5px 9px;border-radius:4px;font-size:11px;font-weight:700}.layout{display:flex;min-height:calc(100vh - 52px)}aside{width:250px;background:var(--s);color:#dce0e3;flex-shrink:0}.side{padding:15px;border-bottom:1px solid #3b4145;font-weight:600}.tree{padding:9px}.ti{padding:9px 10px;border-radius:4px;cursor:pointer}.ti:hover,.ti.on{background:#343b40}.ind{padding-left:31px}.main{flex:1;min-width:0}.bar{height:50px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:7px;padding:0 13px}.btn{border:1px solid var(--l);background:#fff;border-radius:3px;padding:6px 10px;cursor:pointer}.btn:hover{background:#f4f6f8}.pri{background:var(--b);color:#fff;border-color:var(--b)}.content{padding:16px;max-width:1500px;margin:auto}.title{margin:0 0 3px;font-size:21px}.sub{color:var(--m);margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{background:var(--p);border:1px solid var(--l);border-radius:4px}.metric{padding:12px}.label{font-size:12px;color:var(--m)}.value{font-size:24px;font-weight:600;margin:5px 0}.prog{height:7px;background:#e5e7e9;border-radius:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--b)}.orange i{background:var(--o)}.green i{background:var(--g)}.sec{margin-top:15px}.head{height:42px;background:#fafbfc;border:1px solid var(--l);display:flex;align-items:center;padding:0 12px;font-weight:600}.table{background:#fff;border:1px solid var(--l);border-top:0;overflow:auto}.row{display:grid;grid-template-columns:45px 2fr 1fr 1fr 1fr 1.5fr;min-width:800px;align-items:center;padding:9px 10px;border-bottom:1px solid #eceeef}.row:last-child{border:0}.rh{background:#f7f8f9;color:#666;font-size:12px;font-weight:600}.click{cursor:pointer}.click:hover{background:#f2f7fb}.svc{font-weight:600}.muted{color:var(--m)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:6px}.pill{display:inline-block;background:#e8f6ed;color:#287a43;border-radius:3px;padding:3px 6px;font-size:11px}.split{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.list{padding:11px}.li{display:flex;justify-content:space-between;gap:15px;padding:9px 2px;border-bottom:1px solid #eee}.li:last-child{border:0}.console{background:#111;color:#d7e2da;border-radius:4px;padding:13px;font:12px/1.65 ui-monospace,monospace;min-height:180px}.gt{color:#73d58a}.bt{color:#65b9ff}.notice{padding:11px;background:#fff7df;border:1px solid #efd58e;border-radius:4px;color:#775900}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.box{background:#fff;width:min(900px,94vw);max-height:90vh;overflow:auto;border-radius:5px}.mh{padding:12px 15px;border-bottom:1px solid var(--l);font-weight:600;display:flex;justify-content:space-between}.close{border:0;background:none;font-size:22px;cursor:pointer}.mb{padding:15px}.form{display:grid;gap:10px}.form label{font-size:12px;color:var(--m)}.form input,.form select{padding:8px;border:1px solid var(--l);border-radius:4px}@media(max-width:900px){aside{width:210px}.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}@media(max-width:600px){aside{display:none}.grid{grid-template-columns:1fr 1fr}.content{padding:10px}.crumb{display:none}}
</style></head><body><header class="top"><div class="brand">Proxmox<span> Virtual Environment</span></div><div class="crumb">Datacenter / <b>optiplex</b></div><div class="sim">SIMULACIÓN · NO ES EL SERVIDOR REAL</div></header><div class="layout"><aside><div class="side">Datacenter</div><div class="tree"><div class="ti on" data-v="summary">▦ optiplex</div><div class="ti ind" data-v="services">▣ Services</div><div class="ti ind" data-v="storage">▤ Storage</div><div class="ti ind" data-v="network">⌁ Network</div><div class="ti ind" data-v="backup">◫ Backup</div><div class="ti ind" data-v="tasks">✓ Task History</div></div></aside><main class="main"><div class="bar"><button class="btn" onclick="refresh()">↻ Refresh</button><button class="btn pri" onclick="ct()">+ Create CT</button><button class="btn" onclick="vm()">+ Create VM</button><button class="btn" onclick="backup()">Backup</button><button class="btn" onclick="con()">Console</button></div><div class="content" id="app"></div></main></div><div class="modal" id="modal"><div class="box"><div class="mh"><span id="mt"></span><button class="close" onclick="closeM()">×</button></div><div class="mb" id="mb"></div></div></div><script>
const S=[['01','The Hub','Homarr','Docker','128–220 MB','Dashboard principal'],['02','Pocket ID','Pocket ID','LXC / Docker','80–160 MB','SSO + passkeys'],['03','Caddy','Caddy','LXC / Docker','20–60 MB','Reverse proxy + HTTPS'],['04','AdGuard Home','AdGuard Home','LXC','60–120 MB','DNS / filtrado'],['05','ntfy','ntfy','LXC independiente','70–180 MB','Alertas fuera de Docker'],['06','Forgejo','Forgejo','Docker','150–300 MB','Git self-hosted'],['07','Transmission','Transmission','Docker','30–100 MB','Descargas'],['08','Nextcloud','Nextcloud + DB','Docker','500–900 MB','Archivos / nube'],['09','Home Assistant','Home Assistant','Docker / LXC','300–700 MB','Domótica'],['10','Jellyfin','Jellyfin','Docker','150–400 MB','Multimedia'],['11','n8n','n8n','Docker','150–350 MB','Automatización'],['12','Uptime Kuma','Uptime Kuma','Docker','80–180 MB','Disponibilidad'],['13','Restic','Restic','Host / Docker','Bajo demanda','Motor de backup'],['14','Backrest','Backrest','Docker','50–150 MB','Gestión de Restic'],['15','Dozzle','Dozzle','Docker','20–70 MB','Logs Docker'],['16','Tools Hub','Tools Hub','Docker','100–300 MB','IT-Tools · CyberChef · ChangeDetection']];
const stat=s=>s==='Running'?'<i class="dot"></i>Running':'<span class="pill">READY</span>';
function table(){return '<div class="table"><div class="row rh"><div>ID</div><div>Name</div><div>Placement</div><div>RAM plan</div><div>Status</div><div>Purpose</div></div>'+S.map(x=>`<div class="row click" onclick="svc('${x[1]}')"><div>${x[0]}</div><div><b class="svc">${x[1]}</b><br><small>${x[2]}</small></div><div>${x[3]}</div><div>${x[4]}</div><div>${stat(x[0]==='13'?'Ready':'Running')}</div><div class="muted">${x[5]}</div></div>`).join('')+'</div>'}
function render(v='summary'){let h='';if(v==='summary')h=`<h1 class="title">optiplex</h1><div class="sub">Intel Core i5-6500 · 8 GB RAM · Proxmox VE · Operación Optiplex</div><div class="grid"><div class="card metric"><div class="label">CPU usage</div><div class="value">7.4%</div><div class="prog"><i style="width:7.4%"></i></div></div><div class="card metric"><div class="label">Memory usage</div><div class="value">2.31 / 8 GiB</div><div class="prog orange"><i style="width:29%"></i></div></div><div class="card metric"><div class="label">Storage</div><div class="value">22%</div><div class="prog green"><i style="width:22%"></i></div></div><div class="card metric"><div class="label">Uptime</div><div class="value">00:17:42</div><div class="muted">simulation runtime</div></div></div><div class="sec"><div class="head">Node information</div><div class="split"><div class="card list"><div class="li"><span>CPU</span><b>Intel Core i5-6500 · 4C/4T</b></div><div class="li"><span>RAM</span><b>8 GiB DDR4</b></div><div class="li"><span>Virtualization</span><b>VT-x / IOMMU</b></div><div class="li"><span>GPU</span><b>Intel HD Graphics 530</b></div><div class="li"><span>Network</span><b>1 GbE · vmbr0</b></div></div><div class="card list"><div class="li"><span>Domain</span><b>thehub.de5.net</b></div><div class="li"><span>Proxy</span><b>Caddy + HTTPS</b></div><div class="li"><span>Auth</span><b>Pocket ID + passkeys</b></div><div class="li"><span>Emergency</span><b>Tailscale</b></div><div class="li"><span>Alerts</span><b>ntfy · independent LXC</b></div></div></div></div><div class="sec"><div class="head">Guests / services</div>${table()}</div>`;else if(v==='services')h=`<h1 class="title">Services</h1><div class="sub">Inventario confirmado de Operación Optiplex</div>${table()}<div class="muted">RAM = rangos de planificación. yt-dlp y smartctl son herramientas bajo demanda.</div>`;else if(v==='storage')h=`<h1 class="title">Storage</h1><div class="sub">Almacenamiento previsto</div><div class="grid"><div class="card metric"><div class="label">NVMe</div><div class="value">~1 TB</div><div class="muted">Sistema + datos</div></div><div class="card metric"><div class="label">SMART</div><div class="value">smartctl</div><span class="pill">PLANNED</span></div><div class="card metric"><div class="label">Backup</div><div class="value">Restic</div><div class="muted">Backrest = gestor</div></div><div class="card metric"><div class="label">Downloads</div><div class="value">Transmission</div><div class="muted">n8n orchestration</div></div></div><div class="sec"><div class="head">Mount points</div><div class="card list"><div class="li"><span>/</span><b>Proxmox system</b></div><div class="li"><span>/var/lib/vz</span><b>LXC / local storage</b></div><div class="li"><span>/srv/data</span><b>Nextcloud · Jellyfin · downloads</b></div><div class="li"><span>/backup</span><b>Restic repository</b></div></div></div>`;else if(v==='network')h=`<h1 class="title">Network</h1><div class="sub">Diseño de red — router sin modificar</div><div class="sec"><div class="card list"><div class="li"><span>LAN</span><b>192.168.1.x</b></div><div class="li"><span>Bridge</span><b>vmbr0</b></div><div class="li"><span>DNS</span><b>AdGuard Home</b></div><div class="li"><span>Public DNS</span><b>thehub.de5.net · DNSHE</b></div><div class="li"><span>Proxy</span><b>Caddy · HTTPS</b></div><div class="li"><span>Auth</span><b>Pocket ID + passkeys</b></div><div class="li"><span>Emergency</span><b>Tailscale</b></div></div></div><div class="sec"><div class="head">Traffic model</div><div class="console"><span class="bt">Internet</span> → Caddy → Pocket ID → protected services<br>LAN / private IP → internal access according to service policy<br>Tailscale → emergency/admin path<br><span class="gt">No router changes planned.</span></div></div>`;else if(v==='backup')h=`<h1 class="title">Backup</h1><div class="sub">Restic + Backrest</div><div class="grid"><div class="card metric"><div class="label">Engine</div><div class="value">Restic</div><span class="pill">READY</span></div><div class="card metric"><div class="label">Manager</div><div class="value">Backrest</div><span class="pill">RUNNING</span></div><div class="card metric"><div class="label">Alerts</div><div class="value">ntfy</div><div class="muted">failure notification</div></div><div class="card metric"><div class="label">Restore</div><div class="value">Planned</div></div></div><div class="sec"><div class="notice">Restic y Backrest no son dos sistemas de backup: Backrest gestiona Restic.</div></div>`;else h=`<h1 class="title">Task History</h1><div class="sub">Actividad simulada del nodo optiplex</div><div class="table"><div class="row rh"><div>ID</div><div>Task</div><div>User</div><div>Node</div><div>Status</div><div>Time</div></div>${['Container startup','SMART check','Restic snapshot','n8n workflow','Uptime Kuma check'].map((x,i)=>`<div class="row"><div>${100+i}</div><div>${x}</div><div>root</div><div>optiplex</div><div>${stat('Running')}</div><div>${i+1} min ago</div></div>`).join('')}</div>`;document.getElementById('app').innerHTML=h;document.querySelectorAll('.ti').forEach(e=>e.classList.toggle('on',e.dataset.v===v))}
function svc(n){let x=S.find(a=>a[1]===n);openM(n,`<div class="grid"><div class="card metric"><div class="label">Application</div><div class="value" style="font-size:18px">${x[2]}</div></div><div class="card metric"><div class="label">Placement</div><div class="value" style="font-size:18px">${x[3]}</div></div><div class="card metric"><div class="label">RAM</div><div class="value" style="font-size:18px">${x[4]}</div></div><div class="card metric"><div class="label">State</div><div class="value" style="font-size:18px">${x[0]==='13'?'Ready':'Running'}</div></div></div><div class="sec"><div class="head">Architecture</div><div class="card list"><div class="li"><span>Purpose</span><b>${x[5]}</b></div><div class="li"><span>Access</span><b>${x[1]==='Caddy'?'Public entry point':'Policy via Caddy / LAN'}</b></div><div class="li"><span>Project status</span><b>Confirmed</b></div></div></div>`)}
function openM(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}function task(t){openM('Proxmox task',`<div class="notice">Simulación: <b>${t}</b></div><div class="console" style="margin-top:12px"><span class="gt">TASK OK</span> — simulation only<br>Node: optiplex<br>Action: ${t}<br>Time: ${new Date().toLocaleTimeString()}</div>`)}function ct(){openM('Create CT','<div class="form"><label>Hostname</label><input value="new-container"><label>CT ID</label><input value="100"><label>Template</label><select><option>Debian 13</option><option>Ubuntu 24.04</option></select><button class="btn pri" onclick="task(\'Create CT — simulation\')">Create</button></div>')}function vm(){openM('Create VM','<div class="form"><label>Name</label><input value="new-vm"><label>VM ID</label><input value="200"><label>ISO</label><input value="proxmox-ve.iso"><button class="btn pri" onclick="task(\'Create VM — simulation\')">Create</button></div>')}function backup(){openM('Backup','<div class="notice">Simulando backup con Restic gestionado por Backrest.</div><div class="console" style="margin-top:12px"><span class="gt">OK</span> snapshot simulated<br>Repository: restic<br>Failure notification: ntfy</div>')}function con(){openM('Shell — optiplex','<div class="console"><span class="gt">root@optiplex</span>:~# pveversion<br>pve-manager/9.x <span class="muted">(simulation)</span><br><span class="gt">root@optiplex</span>:~# free -h<br>Mem: 7.8Gi total · 2.3Gi used · 5.5Gi available<br><span class="gt">root@optiplex</span>:~# pct list<br>VMID Status Name<br>100 running adguard<br>101 running ntfy<br><span class="gt">root@optiplex</span>:~# docker ps<br>thehub · pocket-id · caddy · nextcloud · jellyfin · n8n · forgejo · transmission · kuma · backrest · dozzle · tools-hub<br><span class="gt">root@optiplex</span>:~# <span class="bt">_</span></div>')}function refresh(){render(document.querySelector('.ti.on')?.dataset.v||'summary');openM('Refresh','<div class="notice">Estado simulado actualizado correctamente.</div>')}document.querySelectorAll('.ti').forEach(e=>e.onclick=()=>render(e.dataset.v));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};render();
</script></body></html>
